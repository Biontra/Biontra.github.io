<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" role="img" aria-label="Dot plot of two scores for five video models: did the command and kept the character.">
<title>Dot plot of two scores for five video models: did the command and kept the character.</title>
<style>
.bg{fill:#0c1424}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#343432}.track{stroke:#4a4a47}
.a{fill:#3987e5}.b{fill:#d95926}.n{fill:#8f8e88}.ring{stroke:#0c1424}.mark{stroke:#f0efec}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:11.5px}.l{font-size:13px}.v{font-size:13px;font-weight:600}
.ax{font-size:11px}
</style>
<rect class="bg" width="480" height="390" rx="8"/>
<text class="t1 h" x="16" y="28">Kling did every command</text>
<text class="t1 h" x="16" y="48">but kept the character least</text>
<text class="t2 s" x="16" y="68">Correct judge answers per model, in %. The axis starts at 75.</text>
<text class="t2 s" x="16" y="83">One try per command, so small gaps are not a ranking.</text>
<circle class="a" cx="31" cy="108" r="5"/><text class="t2 s" x="41" y="112">Did the command</text>
<circle class="b" cx="161" cy="108" r="5"/><text class="t2 s" x="171" y="112">Kept the character</text>
<text class="t2 s" x="408" y="112" text-anchor="end">Did</text><text class="t2 s" x="464" y="112" text-anchor="end">Kept</text>
<line class="grid" x1="26.0" y1="130" x2="26.0" y2="360"/>
